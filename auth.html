<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · NovaProxy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app.css"></head><body class="app-body"><main class="auth-layout"><a class="brand" href="index.html"><i></i>NOVAPROXY</a><section class="auth-panel"><p class="eyebrow">开始使用 NOVAPROXY</p><h1 id="auth-title">欢迎回来</h1><p class="auth-sub" id="auth-sub">登录以管理您的代理网络。</p><form id="auth-form"><label id="name-field">姓名<input id="auth-name" required placeholder="您的称呼"></label><label>邮箱地址<input id="auth-email" type="email" required placeholder="name@company.com"></label><label>密码<input id="auth-password" type="password" minlength="6" required placeholder="至少 6 位字符"></label><button class="btn full" id="auth-submit">创建账户 <span>→</span></button></form><p class="form-switch" id="auth-switch"></p><p class="fine">演示站点：账户资料仅保存在当前浏览器。</p></section><aside class="auth-aside"><p class="eyebrow"><span></span> 一站式代理控制台</p><h2>让全球连接，<br><em>变得简单。</em></h2><div class="mini-testimonial">“从采购到提取只需几分钟，团队可以专注于真正重要的数据工作。”<b>— NovaProxy 用户</b></div></aside></main><div class="toast"></div><script src="app.js"></script><script>const params=new URLSearchParams(location.search);let register=params.get('mode')==='register';const title=document.querySelector('#auth-title'),sub=document.querySelector('#auth-sub'),nameField=document.querySelector('#name-field'),btn=document.querySelector('#auth-submit'),sw=document.querySelector('#auth-switch');function draw(){title.textContent=register?'创建您的账户':'欢迎回来';sub.textContent=register?'免费创建账户，即刻领取测试额度。':'登录以管理您的代理网络。';nameField.hidden=!register;document.querySelector('#auth-name').required=register;btn.innerHTML=(register?'创建账户':'登录控制台')+' <span>→</span>';sw.innerHTML=register?'已有账户？ <a href="auth.html">立即登录</a>':'还没有账户？ <a href="auth.html?mode=register">免费注册</a>'}draw();document.querySelector('#auth-form').addEventListener('submit',e=>{e.preventDefault();const email=document.querySelector('#auth-email').value;const name=document.querySelector('#auth-name').value||email.split('@')[0];store.login({name,email,createdAt:new Date().toISOString()});location.href='dashboard.html';});</script></body></html>
