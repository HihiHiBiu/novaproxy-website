<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>控制台 · NovaProxy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app.css"></head><body class="console-body"><aside class="sidebar"><a class="brand" href="index.html"><i></i>NOVAPROXY</a><nav><a class="active" href="#overview">概览</a><a href="#extract">代理提取</a><a href="#orders">我的订单</a><a href="#account">个人中心</a></nav><div class="sidebar-bottom"><span class="avatar" data-user-initial>U</span><div><b data-user-name>用户</b><small>个人账户</small></div><button data-logout title="退出登录">↗</button></div></aside><main class="console-main"><header><div><p class="eyebrow">控制台</p><h1>你好，<span data-user-name>用户</span>。</h1></div><a class="btn btn-small" href="pricing.html">购买流量 <span>+</span></a></header><section id="overview" class="overview"><article><span>当前套餐</span><strong id="active-plan">尚未开通</strong><small id="plan-traffic">选择套餐以开始使用</small></article><article><span>可用流量</span><strong id="traffic-left">0 GB</strong><small>本周期剩余</small></article><article><span>代理通道</span><strong id="channel-count">0</strong><small>已创建的提取通道</small></article><article><span>请求成功率</span><strong>99.83%</strong><small>过去 24 小时</small></article></section><section id="extract" class="console-section extract-panel"><div class="section-title"><div><p class="eyebrow">代理提取</p><h2>创建一个新的代理通道</h2></div><span class="demo-badge">演示模式</span></div><form id="proxy-form" class="proxy-form"><label>代理类型<select id="proxy-type"><option>动态住宅</option><option>静态 ISP</option><option>数据中心</option></select></label><label>国家 / 地区<select id="proxy-country"><option value="US">美国 (US)</option><option value="GB">英国 (GB)</option><option value="DE">德国 (DE)</option><option value="SG">新加坡 (SG)</option><option value="JP">日本 (JP)</option></select></label><label>会话时长<select id="proxy-session"><option>自动轮换</option><option>10 分钟</option><option>30 分钟</option><option>60 分钟</option></select></label><label>提取数量<select id="proxy-amount"><option value="1">1 个</option><option value="5">5 个</option><option value="10">10 个</option></select></label><button class="btn">生成代理 <span>→</span></button></form><div class="endpoint" id="endpoint-empty">选择参数后生成您的专属代理端点。</div><div class="endpoint hidden" id="endpoint-result"><div><span>HTTP(S) 代理端点</span><code id="endpoint-code"></code></div><button id="copy-endpoint">复制</button></div></section><section id="orders" class="console-section"><div class="section-title"><div><p class="eyebrow">订单中心</p><h2>我的订单</h2></div><a class="text-link" href="pricing.html">购买新套餐 <b>→</b></a></div><div class="table-wrap"><table><thead><tr><th>订单号</th><th>套餐</th><th>金额</th><th>状态</th><th>日期</th></tr></thead><tbody id="orders-body"></tbody></table><div class="empty-state" id="orders-empty">暂无订单。<a href="pricing.html">选择套餐开始使用</a></div></div></section><section id="account" class="console-section account-grid"><div><p class="eyebrow">个人中心</p><h2>账户信息</h2><label>姓名<input id="profile-name"></label><label>邮箱<input id="profile-email" disabled></label><button class="btn btn-small" id="save-profile">保存修改</button></div><div class="api-card"><span>API 密钥</span><code id="api-key">np_live_••••••••••••••••</code><button id="reveal-key">显示密钥</button><small>请勿将密钥暴露在浏览器端或公开代码中。</small></div></section></main><div class="toast"></div><script src="app.js"></script><script>const user=store.user();if(!user)location.href='auth.html?mode=register';const active=store.get('activePlan',null),orders=store.get('orders',[]),channels=store.get('channels',[]);document.querySelector('[data-user-initial]').textContent=(user?.name||'U').slice(0,1).toUpperCase();document.querySelector('#active-plan').textContent=active?.name||'尚未开通';document.querySelector('#plan-traffic').textContent=active?active.traffic+' / 月':'选择套餐以开始使用';document.querySelector('#traffic-left').textContent=active?active.traffic:'0 GB';document.querySelector('#channel-count').textContent=channels.length;const body=document.querySelector('#orders-body'),empty=document.querySelector('#orders-empty');body.innerHTML=orders.map(o=>`<tr><td><code>${o.id}</code></td><td>${o.name} · ${o.traffic}</td><td>${currency(o.amount)}</td><td><span class="status">${o.status}</span></td><td>${formatDate(o.date)}</td></tr>`).join('');empty.hidden=orders.length>0;document.querySelector('#proxy-form').addEventListener('submit',e=>{e.preventDefault();if(!active){toast('请先购买套餐后再提取代理。');return}const type=document.querySelector('#proxy-type').value,country=document.querySelector('#proxy-country').value,session=document.querySelector('#proxy-session').value,amount=document.querySelector('#proxy-amount').value,port=8000+Math.floor(Math.random()*900);const endpoint=`http://np-${country.toLowerCase()}-${randomId('s').toLowerCase()}:demo_password@gateway.novaproxy.io:${port}`;const channel={id:randomId('CH-'),type,country,session,amount,endpoint,date:new Date().toISOString()};channels.unshift(channel);store.set('channels',channels);document.querySelector('#channel-count').textContent=channels.length;document.querySelector('#endpoint-code').textContent=endpoint;document.querySelector('#endpoint-empty').classList.add('hidden');document.querySelector('#endpoint-result').classList.remove('hidden');toast('代理端点已生成。')});document.querySelector('#copy-endpoint').addEventListener('click',async()=>{await navigator.clipboard?.writeText(document.querySelector('#endpoint-code').textContent);toast('代理端点已复制。')});document.querySelector('#profile-name').value=user?.name||'';document.querySelector('#profile-email').value=user?.email||'';document.querySelector('#save-profile').addEventListener('click',()=>{user.name=document.querySelector('#profile-name').value||user.name;store.login(user);document.querySelectorAll('[data-user-name]').forEach(e=>e.textContent=user.name);toast('个人资料已保存。')});document.querySelector('#reveal-key').addEventListener('click',e=>{document.querySelector('#api-key').textContent='np_live_demo_91xKa8rQ2mLp7Vz';e.target.textContent='已显示';});if(new URLSearchParams(location.search).get('success'))toast('支付成功，套餐已即时开通。');</script></body></html>
