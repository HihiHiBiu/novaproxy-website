<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认订单 · NovaProxy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app.css"></head><body class="app-body"><header class="header container"><a class="brand" href="index.html"><i></i>NOVAPROXY</a><span class="secure-note">🔒 安全订单</span></header><main class="checkout container"><section><p class="eyebrow">确认并支付</p><h1>完成您的订单</h1><form id="payment-form" class="payment-form" novalidate><h3>支付方式</h3><label class="pay-option"><input type="radio" name="pay" checked> <span>银行卡</span><small>Visa · Mastercard · UnionPay</small></label><div class="card-inputs"><label>持卡人姓名<input placeholder="NAME ON CARD"></label><label>卡号<input inputmode="numeric" placeholder="4242 4242 4242 4242"></label><div><label>有效期<input placeholder="MM / YY"></label><label>安全码<input placeholder="CVC"></label></div></div><button class="btn full">确认支付 <span>→</span></button><p class="fine">这是演示支付流程，不会产生真实扣款。</p></form></section><aside class="order-summary"><p>订单摘要</p><h2 id="plan-name"></h2><div><span>月度套餐</span><b id="plan-price"></b></div><div><span>税费</span><b>¥0</b></div><hr><div class="total"><span>总计</span><b id="plan-total"></b></div><small>购买后将立即开通，可在控制台提取代理。</small></aside></main><div class="toast"></div><script src="app.js"></script><script>const catalog={starter:['入门方案','5 GB',159],growth:['增长方案','20 GB',499],scale:['规模方案','50 GB',899]};const id=new URLSearchParams(location.search).get('plan')||'growth',plan=catalog[id];document.querySelector('#plan-name').textContent=plan[0]+' · '+plan[1];document.querySelector('#plan-price').textContent=currency(plan[2]);document.querySelector('#plan-total').textContent=currency(plan[2]);document.querySelector('#payment-form').addEventListener('submit',e=>{e.preventDefault();if(!store.user()){location.href='auth.html?mode=register';return}const order={id:randomId('NP-'),plan:id,name:plan[0],traffic:plan[1],amount:plan[2],status:'已支付',date:new Date().toISOString()};const orders=store.get('orders',[]);orders.unshift(order);store.set('orders',orders);store.set('activePlan',order);location.href='dashboard.html?success=1';});</script></body></html>
